<div id="form">

    <h2>Inscrição na Corrida</h2>

    <form id="form-inscricao">

        <div class="linha">

            <div class="campo-atleta">
                <label for="atleta">Atleta Cadastrado</label>

                <select id="atleta" name="atleta">
                    <option value="">Selecione o atleta</option>
                    <option value="1">João da Silva</option>
                    <option value="2">Maria Souza</option>
                </select>
            </div>

            <div class="campo-cpf">
                <label for="cpf">Ou Buscar por CPF</label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00">
            </div>

        </div>


        <div class="linha">

            <div class="campo-corrida">
                <label for="corrida">Corrida Escolhida</label>

                <select id="corrida" name="corrida">
                    <option value="">Selecione a corrida</option>
                    <option value="1">
                        Corridas das Estações - Etapa Verão
                    </option>
                    <option value="2">
                        Desafio das Montanhas
                    </option>
                </select>
            </div>


            <div class="campo-distancia">

                <label>Distância da Prova</label>

                <div class="radios">
                    <input type="radio" id="5km" name="distancia" value="5km">
                    <label for="5km">5km</label>

                    <input type="radio" id="10km" name="distancia" value="10km">
                    <label for="10km">10km</label>

                    <input type="radio" id="25km" name="distancia" value="25km">
                    <label for="25km">25km</label>
                </div>

            </div>

        </div>


        <div class="linha">

            <div class="campo-camiseta">

                <label for="camiseta">Tamanho da Camiseta (Kit)</label>

                <select id="camiseta" name="camiseta">
                    <option value="">Selecione</option>
                    <option value="P">P</option>
                    <option value="M">M</option>
                    <option value="G">G</option>
                    <option value="GG">GG</option>
                </select>

            </div>


            <div class="campo-categoria">

                <label for="categoria">Categoria / Faixa Etária</label>

                <input
                    type="text"
                    id="categoria"
                    name="categoria"
                    value="Geral Masculino / 30-39 anos"
                    readonly>
            </div>

        </div>


        <div class="valor">
            <strong>Valor da Inscrição:</strong>
            <span>R$ 89,90</span>
        </div>


        <div class="termos">
            <input type="checkbox" id="aceito">
            <label for="aceito">
                Li e aceito os termos do regulamento da prova e declaração de saúde.
            </label>
        </div>

        <button type="submit" id="btnFinalizar">
            Finalizar e Ir para Pagamento
        </button>

    </form>

</div>
