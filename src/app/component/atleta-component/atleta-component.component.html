<section id="form">
    <h2> Cadastro de Atleta </h2>

    <form id="form-atleta" (submit)="enviarDadosAtleta()">

        <label for="nome"> Nome Completo </label>
        <input type="text" name="nome" [(ngModel)]="nome" id="nome" class="input01"
        maxlength="60" required placeholder="Digite o nome completo">


        <!-- CAMPO ANTIGO: Data de Nascimento -->
        <!--
        <label for="dataNascimento"> Data de Nascimento* </label>
        <input type="date" name="dataNascimento" [(ngModel)]="dataNascimento" id="dataNascimento" class="input02"
        maxlength="8" required placeholder="Digite a Data de Nascimento">
        -->

        <!-- CAMPO ATUAL DO SQL -->
        <label for="datanascimento"> Data de Nascimento* </label>
        <input type="date" name="datanascimento" [(ngModel)]="datanascimento" id="datanascimento" class="input02"
        required>


        <!-- CAMPO ANTIGO: CPF -->
        <!--
        <label for="cpf"> CPF* </label>
        <input type="text" name="cpf" [(ngModel)]="cpf" id="cpf" class="input02"
        maxlength="14" required placeholder="Digite o cpf">
        -->


        <label for="sexo"> Sexo </label>

        <input type="radio" name="sexo" [(ngModel)]="sexo" id="sexoF" class="radio01"
        required value="F"> Feminino

        <input type="radio" name="sexo" [(ngModel)]="sexo" id="sexoM" class="radio01"
        required value="M"> Masculino

        <input type="radio" name="sexo" [(ngModel)]="sexo" id="sexoN" class="radio01"
        required value="N"> Não Declarar


        <!-- CAMPOS ANTIGOS: CEP, RUA, BAIRRO, CIDADE E UF -->
        <!--
        <label for="cep"> CEP* </label>
        <input type="text" name="cep" [(ngModel)]="cep" id="cep" class="input02"
        maxlength="9" required placeholder="Digite o cep">

        <label for="ruaLogradouro"> Rua/Logradouro* </label>
        <input type="text" name="ruaLogradouro" [(ngModel)]="ruaLogradouro" id="ruaLogradouro" class="input01"
        maxlength="100" required placeholder="Digite a rua ou o logradouro">

        <label for="bairro"> Bairro* </label>
        <input type="text" name="bairro" [(ngModel)]="bairro" id="bairro" class="input02"
        maxlength="60" required placeholder="Digite o bairro">

        <label for="cidade"> Cidade* </label>
        <input type="text" name="cidade" [(ngModel)]="cidade" id="cidade" class="input02"
        maxlength="60" required placeholder="Digite a cidade">

        <label for="uf">UF*</label>
        <input type="text" name="uf" [(ngModel)]="uf" id="uf" class="input02"
        maxlength="60" required placeholder="Digite a UF">
        -->


        <!-- CAMPOS NOVOS DO SQL -->

        <label for="peso"> Peso* </label>
        <input type="number" name="peso" [(ngModel)]="peso" id="peso" class="input02"
        required placeholder="Digite o peso">


        <label for="altura"> Altura* </label>
        <input type="number" name="altura" [(ngModel)]="altura" id="altura" class="input02"
        step="0.01" required placeholder="Digite a altura">


        <div id="div-btns">
            <button type="submit" id="btnAdd">
                {{!editar ? 'Cadastrar' : 'Alterar'}}
            </button>

            <button type="reset" id="btnLimpar">
                Limpar
            </button>
        </div>

    </form>
</section>
