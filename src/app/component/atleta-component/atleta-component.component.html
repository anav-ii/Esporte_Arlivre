<section id="form">

    <h2>Cadastro de Atleta</h2>

    <form id="form-atleta" (ngSubmit)="exibirDados()">

        <label for="nome">Nome Completo</label>
        <input type="text" name="nome" [(ngModel)]="nome" id="nome"
            maxlength="60" required
            placeholder="Digite o nome completo">

        <label for="cpf">CPF</label>
        <input type="text" name="cpf" [(ngModel)]="cpf" id="cpf"
            maxlength="14" required
            placeholder="Digite o CPF">

        <label>Sexo</label>

        <div id="opcoes-sexo">
            <div>
                <input type="radio" name="sexo" [(ngModel)]="sexo"
                    id="sexoM" value="M">
                <label for="sexoM">Masculino</label>
            </div>

            <div>
                <input type="radio" name="sexo" [(ngModel)]="sexo"
                    id="sexoF" value="F">
                <label for="sexoF">Feminino</label>
            </div>

            <div>
                <input type="radio" name="sexo" [(ngModel)]="sexo"
                    id="sexoN" value="N">
                <label for="sexoN">Não Declarar</label>
            </div>
        </div>

        <label for="cep">CEP</label>
        <input type="text" name="cep" [(ngModel)]="cep" id="cep"
            maxlength="9" required
            placeholder="Digite o CEP">

        <label for="ruaLogradouro">Rua/Logradouro</label>
        <input type="text" name="ruaLogradouro" [(ngModel)]="ruaLogradouro"
            id="ruaLogradouro" maxlength="100" required
            placeholder="Digite a Rua ou o Logradouro">

        <label for="bairro">Bairro</label>
        <input type="text" name="bairro" [(ngModel)]="bairro" id="bairro"
            maxlength="60" required
            placeholder="Digite o Bairro">

        <label for="cidade">Cidade</label>
        <input type="text" name="cidade" [(ngModel)]="cidade" id="cidade"
            maxlength="14" required
            placeholder="Digite a Cidade">

        <label for="uf">UF*</label>
        <input type="text" name="uf" [(ngModel)]="uf" id="uf"
            maxlength="60" required
            placeholder="Digite a UF">

        <div id="div-btns">
            <button type="submit" id="btnAdd">Cadastrar</button>
            <button type="reset" id="btnLimpar">Limpar</button>
        </div>

    </form>

</section>
